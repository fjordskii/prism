name: backup-drill

on:
  pull_request:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Start MinIO and create prism-drill
        run: |
          curl -fsSL -o minio https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          curl -fsSL -o mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x minio mc
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=drill MINIO_ROOT_PASSWORD=drilldrill ./minio server "$RUNNER_TEMP/minio" --address 127.0.0.1:9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/minio.pid"
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          ./mc alias set local http://127.0.0.1:9000 drill drilldrill
          ./mc mb --ignore-existing local/prism-drill

      - name: Restore drill
        run: bun test tests/drill/backup-restore.test.ts
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: prism-drill
          S3_ACCESS_KEY_ID: drill
          S3_SECRET_ACCESS_KEY: drilldrill
          S3_REGION: us-east-1
          BACKUP_RETENTION_DAYS: "14"
