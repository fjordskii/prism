app = "prism-personalize"
primary_region = "iad"

[build]

[[mounts]]
  source = "prism_data"
  destination = "/data"

[env]
  PORT = "3000"
  DB_PATH = "/data/prism.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    # /api/stats is token-gated. Probe the public snippet instead.
    path = "/snippet.js"
